# Build Nixpacks (Coolify, build pack « Nixpacks ») : mêmes outils pour le web et le worker.
# - ffmpeg via apt (build Ubuntu, avec libass et libx264) ;
# - Deno, runtime JavaScript dont yt-dlp a besoin pour YouTube.
# yt-dlp n'est pas installé ici : le worker le télécharge lui-même au démarrage dans
# STORAGE_DIR/bin (volume persistant) puis le met à jour à chaque démarrage (voir ensureYtDlp).

[phases.setup]
nixPkgs = ["...", "deno"]
aptPkgs = ["...", "ffmpeg"]
